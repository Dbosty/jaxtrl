rl: ppo
rl_kwargs:
  entropy_eps: 5e-3
  num_epochs: 10
  sub_batch_size: 50_000
  gamma: 0.99
  gae_lambda: 0.95
  clip_epsilon: 0.2
  max_grad_norm: 0.5
  critic_coef: 0.5
  lr: 0.0003
  loss_critic_type: smooth_l1

actor: lstm
critic: lstm

actor_kwargs:
  lstm_hidden_size: 64
  head_net_arch: [64, 32, 16]
  head_activation_func: relu
  distribution: tanh
  distribution_kwargs:
    tanh_loc: true

critic_kwargs:
  lstm_hidden_size: 64
  head_net_arch: [64, 32, 16]
  head_activation_func: relu
