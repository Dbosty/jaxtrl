collect:
    value:
        batch:
            num_envs: 250
            timesteps_per_env: 100
        save:
            freq: 1000000
        total_timesteps: 80000
        visualize:
            fps: 50
            freq: 1000000
            timesteps: 50
        wandb:
            offline: false
            sync_tensorboard: false
device:
    value: cuda
env_var:
    value:
        wandb:
            entity: peu
            project: apegs-acc
exp_name_suffix:
    value: _40M_8k
level_k:
    value:
        K: 8
        alpha_n: 10
        checkpoint_dir: checkpoints/level_k_40M_8k
        eta_evader: 0.05
        eta_pursuer: 0.05
metrics_dir:
    value: metrics/level_k_40M_8k
seed:
    value: 2360997242
train:
    value:
        actor: lstm
        actor_kwargs:
            distribution: tanh
            distribution_kwargs:
                tanh_loc: true
            head_activation_func: relu
            head_net_arch:
                - 64
                - 32
                - 16
            lstm_hidden_size: 64
        critic: lstm
        critic_kwargs:
            head_activation_func: relu
            head_net_arch:
                - 64
                - 32
                - 16
            lstm_hidden_size: 64
        rl: ppo
        rl_kwargs:
            clip_epsilon: 0.2
            critic_coef: 0.5
            entropy_eps: 0.005
            gae_lambda: 0.95
            gamma: 0.99
            loss_critic_type: smooth_l1
            lr: 0.0003
            max_grad_norm: 0.5
            num_epochs: 10
            sub_batch_size: 5000
