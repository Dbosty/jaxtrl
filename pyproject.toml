[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxtrl"
version = "0.1.0"
requires-python = ">=3.8"

dependencies = [
    #"torch",
    #"jax",  
    "flax",
    "numpy",
    "jaxtyping",
    "torchrl",
    "hydra-core", 
]

[tool.setuptools.packages.find]
where = ["src"]
